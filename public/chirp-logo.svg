<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <!-- Outer Gradient Border: from indigo-600 via indigo-500 to purple-500 -->
    <linearGradient id="chirpBorderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Shadow Filter simulating shadow-lg shadow-indigo-500/30 -->
    <filter id="chirpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Gradient Border (56x56, r=16px) -->
  <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="16" fill="url(#chirpBorderGradient)" filter="url(#chirpGlow)" />

  <!-- Inner Dark Background Container (zinc-950: #09090b, p=1.5px -> 53x53, r=14px) -->
  <rect x="1.5" y="1.5" width="53" height="53" rx="14" fill="#09090b" />

  <!-- Text Glyph: "Ch" (font-black text-white and text-indigo-400) -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="-0.05em">
    <tspan fill="#ffffff" font-weight="900">C</tspan><tspan fill="#818cf8" font-weight="700">h</tspan>
  </text>
</svg>
